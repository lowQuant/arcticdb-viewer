{% extends "base.html" %}
{% block title %}{{ library }} - arcticdb-viewer{% endblock %}

{% block content %}
<div style="max-width: 1100px;">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-2">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/libraries">Libraries</a></li>
            <li class="breadcrumb-item active">{{ library }}</li>
        </ol>
    </nav>

    <div class="page-head">
        <div>
            <div class="eyebrow mb-1">Library</div>
            <h4><i class="bi bi-database"></i> {{ library }}</h4>
        </div>
        <div class="page-head-meta">
            <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#upload-form">
                <i class="bi bi-upload"></i> Upload CSV
            </button>
            <button class="btn btn-sm btn-outline-primary" data-bs-toggle="collapse" data-bs-target="#create-symbol-form">
                <i class="bi bi-plus-lg"></i> New symbol
            </button>
        </div>
    </div>

    <!-- Search -->
    <div class="mb-3" style="position: relative;">
        <i class="bi bi-search" style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 0.875rem;"></i>
        <input type="search" class="form-control" placeholder="Search symbols…"
               name="q" value="{{ query }}"
               style="padding-left: 2.25rem; font-family: var(--mono); font-size: 0.8125rem;"
               hx-get="/libraries/{{ library }}/symbols"
               hx-target="#symbol-list"
               hx-swap="innerHTML"
               hx-trigger="keyup changed delay:300ms"
               hx-include="this">
    </div>

    <!-- Create Symbol form -->
    <div class="collapse mb-3" id="create-symbol-form">
        <div class="qt-panel">
            <div class="qt-panel-head">
                <span class="qt-panel-head-title"><i class="bi bi-plus-circle"></i> New symbol schema</span>
                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#create-symbol-form">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="qt-panel-body">
                <div class="mb-3">
                    <label class="form-label">Symbol name</label>
                    <input type="text" id="new-sym-name" class="form-control form-control-sm" placeholder="my_symbol" required
                           style="font-family: var(--mono);">
                </div>
                <div class="mb-3">
                    <label class="form-label">Index</label>
                    <div class="d-flex gap-2">
                        <select id="new-sym-index-type" class="form-select form-select-sm" style="width:160px;">
                            <option value="datetime">DateTime index</option>
                            <option value="integer">Integer index</option>
                            <option value="none">No named index</option>
                        </select>
                        <input type="text" id="new-sym-index-name" class="form-control form-control-sm" placeholder="index name (e.g. Date)" style="flex: 1;">
                    </div>
                </div>
                <div class="mb-2">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label mb-0">Columns</label>
                        <button class="btn btn-sm btn-outline-secondary" onclick="addColumnDef()">
                            <i class="bi bi-plus-lg"></i> Add column
                        </button>
                    </div>
                    <div id="new-sym-columns">
                        <!-- Column rows added dynamically -->
                    </div>
                </div>
                <div class="d-flex gap-2 mt-3 pt-2" style="border-top: 1px solid var(--line-2);">
                    <button class="btn btn-sm btn-primary" onclick="createSymbol()">
                        <i class="bi bi-check-lg"></i> Create symbol
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#create-symbol-form">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload CSV -->
    <div class="collapse mb-3" id="upload-form">
        <div class="qt-panel">
            <div class="qt-panel-head">
                <span class="qt-panel-head-title"><i class="bi bi-cloud-upload"></i> Upload CSV</span>
                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#upload-form">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="qt-panel-body">
                <form hx-post="/api/data/{{ library }}/upload"
                      hx-target="#symbol-list" hx-swap="innerHTML"
                      hx-encoding="multipart/form-data"
                      hx-on::after-request="if(event.detail.successful) this.reset()">
                    <div class="mb-2">
                        <label class="form-label">Symbol name</label>
                        <input type="text" name="symbol" class="form-control form-control-sm" placeholder="my_symbol" required
                               style="font-family: var(--mono);">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">CSV file</label>
                        <input type="file" name="file" class="form-control form-control-sm" accept=".csv" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">
                        <i class="bi bi-upload"></i> Upload &amp; create
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Symbol list -->
    <div id="symbol-list">
        {% include "partials/symbol_list.html" %}
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const LIB = "{{ library }}";

    function addColumnDef() {
        const container = document.getElementById("new-sym-columns");
        const idx = container.children.length;
        container.insertAdjacentHTML("beforeend", `
            <div class="d-flex gap-2 align-items-center mb-1 col-def-row">
                <input type="text" class="form-control form-control-sm col-def-name" placeholder="column_name" style="width:200px; font-family: var(--mono);">
                <select class="form-select form-select-sm col-def-type" style="width:160px;">
                    <option value="float">Number (float)</option>
                    <option value="int">Number (int)</option>
                    <option value="str">Text</option>
                    <option value="bool">Boolean</option>
                </select>
                <button class="btn btn-sm btn-outline-danger" onclick="this.closest('.col-def-row').remove()" title="Remove">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        `);
    }

    addColumnDef();
    addColumnDef();

    document.getElementById("new-sym-columns").addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            const rows = document.querySelectorAll(".col-def-row");
            const lastRow = rows[rows.length - 1];
            const name = lastRow.querySelector(".col-def-name").value.trim();
            if (name) addColumnDef();
        }
    });

    function createSymbol() {
        const name = document.getElementById("new-sym-name").value.trim();
        if (!name) { showToast("Symbol name is required", "error"); return; }

        const indexType = document.getElementById("new-sym-index-type").value;
        const indexName = document.getElementById("new-sym-index-name").value.trim();

        const columns = [];
        document.querySelectorAll(".col-def-row").forEach(row => {
            const colName = row.querySelector(".col-def-name").value.trim();
            const colType = row.querySelector(".col-def-type").value;
            if (colName) columns.push({ name: colName, type: colType });
        });

        if (columns.length === 0) { showToast("Add at least one column", "error"); return; }

        fetch(`/api/symbol/${LIB}/create`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                symbol: name,
                index_type: indexType,
                index_name: indexName || null,
                columns: columns,
            }),
        }).then(r => {
            if (r.ok) {
                showToast(`Symbol '${name}' created`);
                htmx.ajax("GET", `/libraries/${LIB}/symbols`, "#symbol-list");
                const form = document.getElementById("create-symbol-form");
                bootstrap.Collapse.getOrCreateInstance(form).hide();
            } else {
                r.text().then(t => showToast("Error: " + t, "error"));
            }
        });
    }
</script>
{% endblock %}
