{% extends "base.html" %}
{% block title %}Libraries - arcticdb-viewer{% endblock %}

{% block content %}
<div style="max-width: 1100px;">

    <div class="page-head">
        <div>
            <div class="eyebrow mb-1">Workspace</div>
            <h4><i class="bi bi-stack"></i> Libraries</h4>
        </div>
        <div class="page-head-meta">
            {% if not read_only() %}
            <button class="btn btn-sm btn-outline-primary" data-bs-toggle="collapse" data-bs-target="#create-form">
                <i class="bi bi-plus-lg"></i> New library
            </button>
            {% endif %}
        </div>
    </div>

    <!-- Create library form (collapsible) -->
    <div class="collapse mb-3" id="create-form">
        <div class="qt-panel">
            <div class="qt-panel-head">
                <span class="qt-panel-head-title"><i class="bi bi-plus-circle"></i> Create library</span>
                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#create-form">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="qt-panel-body">
                <form hx-post="/libraries" hx-target="#library-list" hx-swap="innerHTML"
                      hx-on::after-request="if(event.detail.successful) this.reset()">
                    <div class="input-group">
                        <input type="text" name="name" class="form-control" placeholder="library_name" required
                               style="font-family: var(--mono);">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-plus-lg"></i> Create
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Library list -->
    <div id="library-list">
        {% include "partials/library_list.html" %}
    </div>
</div>
{% endblock %}
