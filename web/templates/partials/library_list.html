{% if libraries %}
<div class="list-group">
    {% for lib in libraries %}
    <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center bg-dark border">
        <a href="/libraries/{{ lib }}/symbols" class="text-decoration-none text-light flex-grow-1">
            <i class="bi bi-database"></i> {{ lib }}
        </a>
        <button class="btn btn-sm btn-outline-danger"
                hx-delete="/libraries/{{ lib }}"
                hx-target="#library-list"
                hx-swap="innerHTML"
                hx-confirm="Delete library '{{ lib }}'? This cannot be undone.">
            <i class="bi bi-trash"></i>
        </button>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="text-muted text-center py-4">
    No libraries found. Create one to get started.
</div>
{% endif %}
