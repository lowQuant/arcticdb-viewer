<div id="chart-panels">
    <div style="position:relative; height:400px;">
        <canvas id="{{ chart_id }}"></canvas>
    </div>
    <div class="d-flex justify-content-between align-items-center mt-1 px-1">
        <span class="small text-muted" id="chart-point-count"></span>
        <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary py-0 px-2" onclick="chartZoomReset()" title="Reset zoom">
                <i class="bi bi-arrows-angle-expand"></i> Reset
            </button>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
<script>
(function() {
    const mainData = {{ main_chart | safe }};
    const subplotsData = {{ subplots | safe }};
    const panelsContainer = document.getElementById("chart-panels");

    const totalPoints = mainData.datasets.reduce((s, d) => s + d.data.filter(v => v !== null).length, 0);
    document.getElementById("chart-point-count").textContent = totalPoints + " data points";

    subplotsData.forEach((sp, i) => {
        const div = document.createElement("div");
        div.style.position = "relative";
        div.style.height = "180px";
        div.style.marginTop = "4px";
        const canvas = document.createElement("canvas");
        canvas.id = "subplot-" + i;
        div.appendChild(canvas);
        panelsContainer.insertBefore(div, panelsContainer.lastElementChild);
    });

    // Defer chart creation until after the browser has done a layout pass.
    // Without this, Chart.js can measure the parent before the surrounding
    // flex layout settles, render at the wrong width, then shrink on the
    // next resize observer tick.
    requestAnimationFrame(() => {
        renderChartPanel("{{ chart_id }}", mainData, true);
        subplotsData.forEach((sp, i) => renderChartPanel("subplot-" + i, sp, false));
    });
})();

window.chartZoomReset = function() {
    if (window.chartInstance) window.chartInstance.resetZoom();
};

function renderChartPanel(canvasId, chartData, isMain) {
    const ctx = document.getElementById(canvasId).getContext("2d");
    const colors = ["#0d6efd","#198754","#dc3545","#ffc107","#0dcaf0","#6f42c1","#fd7e14","#20c997"];
    const studyColors = ["#ff6384","#36a2eb","#ffce56","#4bc0c0","#9966ff","#ff9f40"];
    const type = chartData.chart_type;
    const upColor = "#198754";
    const downColor = "#dc3545";
    const upBg = "#19875488";
    const downBg = "#dc354588";
    const n = chartData.x_values.length;

    // Determine how many x-axis labels to show based on data density
    const maxTicks = Math.min(20, Math.max(6, Math.floor(n / 30)));

    // Common zoom/pan config — drag to zoom, shift+drag to pan
    const zoomConfig = {
        zoom: {
            wheel: { enabled: false },
            pinch: { enabled: true },
            drag: { enabled: true, backgroundColor: 'rgba(13,110,253,0.15)', borderColor: '#0d6efd', borderWidth: 1 },
            mode: 'x',
        },
        pan: {
            enabled: true,
            mode: 'x',
        },
        limits: {
            x: { minRange: 5 },
        },
    };

    let chart;

    if (type === "candlestick") {
        const ohlcData = chartData.datasets[0].data;

        const candlestickPlugin = {
            id: 'candlestick',
            afterDatasetsDraw(chart) {
                const { ctx, scales: { x, y } } = chart;
                const meta = chart.getDatasetMeta(0);
                const barWidth = Math.max(2, (x.width / ohlcData.length) * 0.6);
                const wickWidth = Math.max(1, barWidth * 0.1);

                ohlcData.forEach((d, i) => {
                    if (!d || d.o == null) return;
                    const cx = meta.data[i].x;
                    const isUp = d.c >= d.o;

                    ctx.beginPath();
                    ctx.strokeStyle = isUp ? upColor : downColor;
                    ctx.lineWidth = wickWidth;
                    ctx.moveTo(cx, y.getPixelForValue(d.h));
                    ctx.lineTo(cx, y.getPixelForValue(d.l));
                    ctx.stroke();

                    const bodyTop = y.getPixelForValue(Math.max(d.o, d.c));
                    const bodyBot = y.getPixelForValue(Math.min(d.o, d.c));
                    const bodyHeight = Math.max(1, bodyBot - bodyTop);
                    ctx.fillStyle = isUp ? upBg : downBg;
                    ctx.strokeStyle = isUp ? upColor : downColor;
                    ctx.lineWidth = 1;
                    ctx.fillRect(cx - barWidth/2, bodyTop, barWidth, bodyHeight);
                    ctx.strokeRect(cx - barWidth/2, bodyTop, barWidth, bodyHeight);
                });
            }
        };

        chart = new Chart(ctx, {
            type: "scatter",
            data: {
                labels: chartData.x_values,
                datasets: [{
                    label: "OHLC",
                    data: ohlcData.map((d, i) => ({ x: i, y: d ? d.c : null })),
                    pointRadius: 0,
                    pointHitRadius: 10,
                }],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: "linear",
                        title: { display: isMain, text: chartData.x_label },
                        ticks: {
                            maxTicksLimit: maxTicks,
                            callback: function(val) {
                                const idx = Math.round(val);
                                if (idx >= 0 && idx < chartData.x_values.length) {
                                    return chartData.x_values[idx];
                                }
                                return '';
                            }
                        },
                        min: -0.5,
                        max: ohlcData.length - 0.5,
                    },
                    y: {
                        beginAtZero: false,
                        min: Math.min(...ohlcData.filter(d=>d).map(d=>d.l)) * 0.998,
                        max: Math.max(...ohlcData.filter(d=>d).map(d=>d.h)) * 1.002,
                    },
                },
                plugins: {
                    legend: { display: false },
                    zoom: zoomConfig,
                    tooltip: {
                        callbacks: {
                            title: function(items) {
                                const idx = Math.round(items[0].parsed.x);
                                return chartData.x_values[idx] || '';
                            },
                            label: function(ctx) {
                                const idx = Math.round(ctx.parsed.x);
                                const d = ohlcData[idx];
                                if (!d) return '';
                                return [`O: ${d.o.toFixed(2)}`, `H: ${d.h.toFixed(2)}`, `L: ${d.l.toFixed(2)}`, `C: ${d.c.toFixed(2)}`];
                            }
                        }
                    }
                },
            },
            plugins: [candlestickPlugin],
        });
    } else {
        // Line / bar / scatter
        let datasetIdx = 0;
        let studyIdx = 0;

        const chartDatasets = chartData.datasets.map((ds) => {
            const isStudy = ds.is_study === true;
            let config;

            if (isStudy) {
                const sColor = studyColors[studyIdx % studyColors.length];
                config = {
                    label: ds.label,
                    data: ds.data,
                    borderColor: sColor,
                    backgroundColor: "transparent",
                    borderDash: [8, 4],
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.2,
                    order: 10,
                };
                studyIdx++;
            } else {
                const color = colors[datasetIdx % colors.length];
                config = {
                    label: ds.label,
                    data: ds.data,
                    borderColor: color,
                    backgroundColor: type === "bar" ? color + "88" : "transparent",
                    borderWidth: type === "line" ? 2 : 1,
                    pointRadius: type === "scatter" ? 3 : 0,
                    tension: 0.1,
                    order: 0,
                };
                datasetIdx++;
            }
            return config;
        });

        chart = new Chart(ctx, {
            type: type,
            data: {
                labels: chartData.x_values,
                datasets: chartDatasets,
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        title: { display: isMain, text: chartData.x_label },
                        ticks: {
                            maxTicksLimit: maxTicks,
                            maxRotation: 45,
                            autoSkip: true,
                        },
                    },
                },
                plugins: {
                    legend: { position: "top" },
                    zoom: zoomConfig,
                },
                interaction: { mode: "index", intersect: false },
            },
        });
    }

    if (isMain) {
        if (window.chartInstance) window.chartInstance.destroy();
        window.chartInstance = chart;
    }
    if (!window.subplotInstances) window.subplotInstances = [];
    if (!isMain) window.subplotInstances.push(chart);
}
</script>
