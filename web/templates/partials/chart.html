<div id="chart-panels">
    <div style="position:relative; height:400px;">
        <canvas id="{{ chart_id }}"></canvas>
    </div>
    <div class="d-flex justify-content-between align-items-center mt-2 px-1">
        <span class="label-mono" id="chart-point-count"></span>
        <div class="d-flex gap-1 align-items-center">
            <span class="label-mono" style="color: var(--ink-4);">Drag to zoom · Shift-drag to pan</span>
            <button class="btn btn-sm btn-outline-secondary" onclick="chartZoomReset()" title="Reset zoom">
                <i class="bi bi-arrows-angle-contract"></i> Reset
            </button>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
<script>
(function() {
    const mainData = {{ main_chart | safe }};
    const subplotsData = {{ subplots | safe }};
    const panelsContainer = document.getElementById("chart-panels");

    const totalPoints = mainData.datasets.reduce((s, d) => s + d.data.filter(v => v !== null).length, 0);
    document.getElementById("chart-point-count").textContent = totalPoints.toLocaleString() + " data points";

    subplotsData.forEach((sp, i) => {
        const div = document.createElement("div");
        div.style.position = "relative";
        div.style.height = "180px";
        div.style.marginTop = "8px";
        div.style.paddingTop = "8px";
        div.style.borderTop = "1px solid var(--line-1)";
        const canvas = document.createElement("canvas");
        canvas.id = "subplot-" + i;
        div.appendChild(canvas);
        panelsContainer.insertBefore(div, panelsContainer.lastElementChild);
    });

    requestAnimationFrame(() => {
        renderChartPanel("{{ chart_id }}", mainData, true);
        subplotsData.forEach((sp, i) => renderChartPanel("subplot-" + i, sp, false));
    });
})();

window.chartZoomReset = function() {
    if (window.chartInstance) window.chartInstance.resetZoom();
};

function renderChartPanel(canvasId, chartData, isMain) {
    const ctx = document.getElementById(canvasId).getContext("2d");

    // Resolve theme-driven colors at draw time so dark/light both work.
    const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const gridColor = cssVar('--chart-grid') || 'rgba(255,255,255,0.04)';
    const tickColor = cssVar('--chart-tick') || '#5c6773';
    const textColor = cssVar('--chart-text') || '#e6edf3';
    const titleColor = cssVar('--chart-title') || '#8b96a3';
    const tooltipBg = cssVar('--chart-tooltip-bg') || '#181f28';
    const tooltipBorder = cssVar('--chart-tooltip-border') || '#283040';
    const zoomFill = cssVar('--chart-zoom-fill') || 'rgba(245,165,36,0.12)';
    const zoomLine = cssVar('--chart-zoom-line') || '#f5a524';

    // Main palette: cool-led for raw data series (blue first). Solid strokes.
    // Study palette: signal-ordered (red, orange, green …) for high-visibility
    // overlays on top of the mains. Dashed strokes (set below).
    // Brand accent (amber) intentionally excluded from both so it stays a state color.
    const colors = ["#3b82f6", "#10b981", "#ef4444", "#a855f7", "#f97316", "#06b6d4", "#ec4899", "#84cc16"];
    const studyColors = ["#ef4444", "#f97316", "#10b981", "#a855f7", "#06b6d4", "#ec4899"];

    const type = chartData.chart_type;
    const upColor = "#22c55e";
    const downColor = "#ef4444";
    const upBg = "#22c55e88";
    const downBg = "#ef444488";
    const n = chartData.x_values.length;

    const maxTicks = Math.min(20, Math.max(6, Math.floor(n / 30)));

    const zoomConfig = {
        zoom: {
            wheel: { enabled: false },
            pinch: { enabled: true },
            drag: { enabled: true, backgroundColor: zoomFill, borderColor: zoomLine, borderWidth: 1 },
            mode: 'x',
        },
        pan: { enabled: true, mode: 'x' },
        limits: { x: { minRange: 5 } },
    };

    const baseAxisStyle = {
        grid: { color: gridColor, drawBorder: false, borderColor: 'transparent', tickColor: 'transparent' },
        border: { display: false },
        ticks: {
            color: tickColor,
            font: { family: "'IBM Plex Mono', monospace", size: 10 },
        },
        title: { color: titleColor, font: { family: "'IBM Plex Mono', monospace", size: 10, weight: '500' } },
    };

    const tooltipStyle = {
        backgroundColor: tooltipBg,
        borderColor: tooltipBorder,
        borderWidth: 1,
        titleColor: textColor,
        titleFont: { family: "'IBM Plex Mono', monospace", size: 11, weight: '500' },
        bodyColor: textColor,
        bodyFont: { family: "'IBM Plex Mono', monospace", size: 11 },
        padding: 8,
        cornerRadius: 4,
    };

    let chart;

    if (type === "candlestick") {
        const ohlcData = chartData.datasets[0].data;

        const candlestickPlugin = {
            id: 'candlestick',
            afterDatasetsDraw(chart) {
                const { ctx, scales: { x, y } } = chart;
                const meta = chart.getDatasetMeta(0);
                const barWidth = Math.max(2, (x.width / ohlcData.length) * 0.6);
                const wickWidth = Math.max(1, barWidth * 0.1);

                ohlcData.forEach((d, i) => {
                    if (!d || d.o == null) return;
                    const cx = meta.data[i].x;
                    const isUp = d.c >= d.o;

                    ctx.beginPath();
                    ctx.strokeStyle = isUp ? upColor : downColor;
                    ctx.lineWidth = wickWidth;
                    ctx.moveTo(cx, y.getPixelForValue(d.h));
                    ctx.lineTo(cx, y.getPixelForValue(d.l));
                    ctx.stroke();

                    const bodyTop = y.getPixelForValue(Math.max(d.o, d.c));
                    const bodyBot = y.getPixelForValue(Math.min(d.o, d.c));
                    const bodyHeight = Math.max(1, bodyBot - bodyTop);
                    ctx.fillStyle = isUp ? upBg : downBg;
                    ctx.strokeStyle = isUp ? upColor : downColor;
                    ctx.lineWidth = 1;
                    ctx.fillRect(cx - barWidth/2, bodyTop, barWidth, bodyHeight);
                    ctx.strokeRect(cx - barWidth/2, bodyTop, barWidth, bodyHeight);
                });
            }
        };

        chart = new Chart(ctx, {
            type: "scatter",
            data: {
                labels: chartData.x_values,
                datasets: [{
                    label: "OHLC",
                    data: ohlcData.map((d, i) => ({ x: i, y: d ? d.c : null })),
                    pointRadius: 0,
                    pointHitRadius: 10,
                }],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        ...baseAxisStyle,
                        type: "linear",
                        title: { ...baseAxisStyle.title, display: isMain, text: chartData.x_label },
                        ticks: {
                            ...baseAxisStyle.ticks,
                            maxTicksLimit: maxTicks,
                            callback: function(val) {
                                const idx = Math.round(val);
                                if (idx >= 0 && idx < chartData.x_values.length) {
                                    return chartData.x_values[idx];
                                }
                                return '';
                            }
                        },
                        min: -0.5,
                        max: ohlcData.length - 0.5,
                    },
                    y: {
                        ...baseAxisStyle,
                        beginAtZero: false,
                        min: Math.min(...ohlcData.filter(d=>d).map(d=>d.l)) * 0.998,
                        max: Math.max(...ohlcData.filter(d=>d).map(d=>d.h)) * 1.002,
                    },
                },
                plugins: {
                    legend: { display: false },
                    zoom: zoomConfig,
                    tooltip: {
                        ...tooltipStyle,
                        callbacks: {
                            title: function(items) {
                                const idx = Math.round(items[0].parsed.x);
                                return chartData.x_values[idx] || '';
                            },
                            label: function(ctx) {
                                const idx = Math.round(ctx.parsed.x);
                                const d = ohlcData[idx];
                                if (!d) return '';
                                return [`O: ${d.o.toFixed(2)}`, `H: ${d.h.toFixed(2)}`, `L: ${d.l.toFixed(2)}`, `C: ${d.c.toFixed(2)}`];
                            }
                        }
                    }
                },
            },
            plugins: [candlestickPlugin],
        });
    } else {
        // Line / bar / scatter
        let datasetIdx = 0;
        let studyIdx = 0;

        const chartDatasets = chartData.datasets.map((ds) => {
            const isStudy = ds.is_study === true;
            let config;

            if (isStudy) {
                const sColor = studyColors[studyIdx % studyColors.length];
                config = {
                    label: ds.label,
                    data: ds.data,
                    borderColor: sColor,
                    backgroundColor: "transparent",
                    borderDash: [6, 4],
                    borderWidth: 1.5,
                    pointRadius: 0,
                    tension: 0.2,
                    order: 10,
                };
                studyIdx++;
            } else {
                const color = colors[datasetIdx % colors.length];
                config = {
                    label: ds.label,
                    data: ds.data,
                    borderColor: color,
                    backgroundColor: type === "bar" ? color + "AA" : color + "14",
                    borderWidth: type === "line" ? 1.75 : 1,
                    pointRadius: type === "scatter" ? 2.5 : 0,
                    pointHoverRadius: 4,
                    tension: 0.15,
                    fill: false,
                    order: 0,
                };
                datasetIdx++;
            }
            return config;
        });

        chart = new Chart(ctx, {
            type: type,
            data: {
                labels: chartData.x_values,
                datasets: chartDatasets,
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        ...baseAxisStyle,
                        title: { ...baseAxisStyle.title, display: isMain, text: chartData.x_label },
                        ticks: {
                            ...baseAxisStyle.ticks,
                            maxTicksLimit: maxTicks,
                            maxRotation: 0,
                            autoSkip: true,
                        },
                    },
                    y: baseAxisStyle,
                },
                plugins: {
                    legend: {
                        position: "top",
                        align: "end",
                        labels: {
                            color: textColor,
                            font: { family: "'IBM Plex Mono', monospace", size: 11 },
                            boxWidth: 10,
                            boxHeight: 2,
                            padding: 12,
                            usePointStyle: false,
                        }
                    },
                    zoom: zoomConfig,
                    tooltip: tooltipStyle,
                },
                interaction: { mode: "index", intersect: false },
            },
        });
    }

    if (isMain) {
        if (window.chartInstance) window.chartInstance.destroy();
        window.chartInstance = chart;
    }
    if (!window.subplotInstances) window.subplotInstances = [];
    if (!isMain) window.subplotInstances.push(chart);
}
</script>
