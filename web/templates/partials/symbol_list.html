{% if symbols %}
<div class="qt-grid cols-2">
    {% for sym in symbols %}
    <div class="qt-tile">
        <a href="/libraries/{{ library }}/symbols/{{ sym }}" class="qt-tile-name" style="text-decoration: none; flex: 1;">
            <i class="bi bi-table"></i>
            <span>{{ sym }}</span>
        </a>
        <div class="d-flex gap-1 align-items-center">
            <span class="label-mono" style="color: var(--ink-4);">→</span>
            {% if not read_only() %}
            <button class="btn btn-sm btn-outline-danger"
                    hx-delete="/libraries/{{ library }}/symbols/{{ sym }}"
                    hx-target="#symbol-list"
                    hx-swap="innerHTML"
                    hx-confirm="Delete symbol '{{ sym }}'? This cannot be undone."
                    onclick="event.stopPropagation();"
                    title="Delete symbol">
                <i class="bi bi-trash"></i>
            </button>
            {% endif %}
        </div>
    </div>
    {% endfor %}
</div>
<div class="mt-3 eyebrow" style="color: var(--ink-4);">
    {{ symbols|length }} {{ 'symbol' if symbols|length == 1 else 'symbols' }} · click to view data
</div>
{% else %}
<div class="qt-panel">
    <div class="qt-panel-body" style="padding: 2rem; text-align: center;">
        <div class="eyebrow mb-2" style="color: var(--ink-4);">No matches</div>
        <p style="color: var(--ink-2); margin: 0;">No symbols in this library yet.</p>
    </div>
</div>
{% endif %}
