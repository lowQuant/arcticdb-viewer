{% if symbols %}
<div class="list-group">
    {% for sym in symbols %}
    <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center bg-dark border">
        <a href="/libraries/{{ library }}/symbols/{{ sym }}" class="text-decoration-none text-light flex-grow-1">
            <i class="bi bi-table"></i> {{ sym }}
        </a>
        <button class="btn btn-sm btn-outline-danger"
                hx-delete="/libraries/{{ library }}/symbols/{{ sym }}"
                hx-target="#symbol-list"
                hx-swap="innerHTML"
                hx-confirm="Delete symbol '{{ sym }}'? This cannot be undone.">
            <i class="bi bi-trash"></i>
        </button>
    </div>
    {% endfor %}
</div>
<div class="text-muted mt-2">{{ symbols|length }} symbol{{ 's' if symbols|length != 1 }}</div>
{% else %}
<div class="text-muted text-center py-4">
    No symbols found.
</div>
{% endif %}
