<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ADBView{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        .table-container { overflow-x: auto; }
        .clickable-row { cursor: pointer; }
        .clickable-row:hover { background-color: rgba(255,255,255,0.05); }
        .toast-container { z-index: 1090; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .sort-icon { opacity: 0.3; }
        .sort-icon.active { opacity: 1; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-database"></i> ADBView
            </a>
            <div class="navbar-nav me-auto">
                {% if is_connected() %}
                <a class="nav-link" href="/libraries">Libraries</a>
                {% endif %}
            </div>
            {% if is_connected() %}
            <div class="navbar-nav">
                <div class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-plug-fill text-success"></i>
                        {{ active_connection() }}
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
                        <li><a class="dropdown-item" href="/"><i class="bi bi-arrow-left-right"></i> Switch connection</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form method="post" action="/disconnect">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-plug"></i> Disconnect
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container-fluid mt-3">
        {% block content %}{% endblock %}
    </div>

    <!-- Toast container for notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Show toast notifications from HTMX responses
        document.addEventListener('htmx:afterRequest', function(evt) {
            const msg = evt.detail.xhr.getResponseHeader('HX-Trigger');
            if (msg) {
                try {
                    const triggers = JSON.parse(msg);
                    if (triggers.showToast) {
                        showToast(triggers.showToast.message, triggers.showToast.type || 'success');
                    }
                } catch(e) {}
            }
        });

        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            const bgClass = type === 'error' ? 'text-bg-danger' : 'text-bg-success';
            const html = `
                <div class="toast align-items-center ${bgClass} border-0" role="alert">
                    <div class="d-flex">
                        <div class="toast-body">${message}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', html);
            const toastEl = container.lastElementChild;
            const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
            toast.show();
            toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
        }

        // Handle HTMX error responses
        document.addEventListener('htmx:responseError', function(evt) {
            showToast('An error occurred: ' + evt.detail.xhr.statusText, 'error');
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
